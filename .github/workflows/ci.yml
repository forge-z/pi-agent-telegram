name: Verify pi-bot Telegram agent
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Offline mocked tests (no bot, API key, email or paid tools)
        run: npm test
      - name: Validate Compose (no required variables)
        run: docker compose config --quiet
      - name: Build container and inspect offline runtime
        run: |
          docker build -t pi-bot:test .
          scripts/smoke-container.sh pi-bot:test
