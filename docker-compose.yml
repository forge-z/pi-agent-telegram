services:
  pi-agent-tg:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      # NODE_ENV and DATA_DIR are fixed in the image (Dockerfile ENV).
      # Required: without these the bot refuses to start. ${VAR:?} ensures Coolify
      # highlights them in the panel and blocks deployment until values are set.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:?}
      # All optional variables (LLM_*, EXECUTOR_*, TZ, ASYNC_JOB_*, etc.) reach
      # the container through env_file above (.env). In Coolify, add them
      # manually in the Environment Variables tab. See .env.example for details.

    volumes:
      - pi_agent_tg_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist/src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 45s

volumes:
  pi_agent_tg_data:
