services:
  pi-bot:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    # No required variables. `npm run setup` stores the Telegram token, allowed
    # users, model key and MCP aggregator on the volume. Values in .env are
    # optional overrides and win over the volume. TZ stays an env var (container clock).
    # NODE_ENV and DATA_DIR are fixed in the image (Dockerfile ENV).

    volumes:
      - pi_bot_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist/src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 45s

volumes:
  pi_bot_data:
