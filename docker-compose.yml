services:
  pi-agent-tg:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      # NODE_ENV and DATA_DIR are fixed in the image (Dockerfile ENV).
      # Required. Everything else comes from `npm run setup`, stored in the volume.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      # Container clock for log timestamps. Schedules carry their own IANA timezone.
      TZ: ${TZ:-}
      # Executor: one authenticated endpoint for every MCP server. https://executor.sh
      EXECUTOR_MCP_URL: ${EXECUTOR_MCP_URL:-}
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
      # Jobs: nothing to fill. The v2 manifest is built in; these only tune or date back to v1.
      # ASYNC_JOB_TIMEOUT_MIN (30) and ASYNC_JOB_POLL_SECONDS (25) are optional.
      # ASYNC_JOB_TOOLS is the deprecated v1 path list, removed 2026-12-31.
      ASYNC_JOB_TOOLS: ${ASYNC_JOB_TOOLS:-}
      ASYNC_JOB_TIMEOUT_MIN: ${ASYNC_JOB_TIMEOUT_MIN:-}
      ASYNC_JOB_POLL_SECONDS: ${ASYNC_JOB_POLL_SECONDS:-}
      # Any other variable reaches the container through env_file below (.env), so the
      # declarations do not grow here. See .env.example for the full list.

    volumes:
      - pi_agent_tg_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist/src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 45s

volumes:
  pi_agent_tg_data:
